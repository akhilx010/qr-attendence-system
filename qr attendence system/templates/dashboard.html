{% extends "base.html" %}
{% block content %}
<div class="hero">
  <h1>Welcome, {{ user.name }}</h1>
  <p>{{ user.role|capitalize }} Portal &mdash; {{ message }}</p>
</div>
<div class="stat-grid">
  <div class="stat"><div class="num">{{ user.role|upper }}</div><div>Your Role</div></div>
  <div class="stat"><div class="num">QR</div><div>Attendance</div></div>
  <div class="stat"><div class="num">Live</div><div>Tracking</div></div>
</div>
{% endblock %}
